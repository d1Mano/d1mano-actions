name: agent-runtime

# Fase 5/7 — control del runtime del agente DENTRO del Codespace:
#   start (--selftest) | status | stop | selftest
# Ejecuta agent/agent_ctl.py vía `gh codespace ssh`. El codespace debe
# estar activo (usar manage-workspace action=start antes).
#
# Secrets: CODESPACES_TOKEN (PAT de la cuenta dueña, scopes codespace+repo).
# Las credenciales de Supabase llegan al codespace como user secrets de
# Codespaces (NO como secrets de este repo ni por SSH manual).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción: start | status | stop | selftest"
        required: true
        default: "status"
        type: string
      workspace:
        description: "Nombre del Codespace (opcional; si no, el primero del repo)"
        required: false
        default: ""
        type: string
      workspace_id:
        description: "Fila en Supabase (workspace-a | workspace-b) — define la cuenta"
        required: false
        default: "workspace-a"
        type: string

permissions:
  contents: read

env:
  WORKSPACE_REPO: d1Mano/d1mano-automation
  # token de la cuenta dueña del codespace: A=Lugoci-dev, B=d1Mano
  GH_TOKEN_A: ${{ secrets.CODESPACES_TOKEN }}
  GH_TOKEN_B: ${{ secrets.CODESPACES_TOKEN_B }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Token de la cuenta dueña (A o B)
        run: |
          if [ "${{ inputs.workspace_id }}" = "workspace-b" ]; then
            echo "GH_TOKEN=$GH_TOKEN_B" >> "$GITHUB_ENV"
          else
            echo "GH_TOKEN=$GH_TOKEN_A" >> "$GITHUB_ENV"
          fi
      - name: Resolver codespace
        id: cs
        run: |
          NAME="${{ inputs.workspace }}"
          if [ -z "$NAME" ]; then
            NAME=$(gh api "repos/$WORKSPACE_REPO/codespaces" --jq '.codespaces[0].name // empty')
          fi
          if [ -z "$NAME" ]; then
            echo "::error::no hay codespace; lanza manage-workspace action=start"
            exit 1
          fi
          STATE=$(gh api "user/codespaces/$NAME" --jq .state)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "codespace: $NAME ($STATE)"

      - name: Actualizar repo dentro del codespace
        run: |
          # gh codespace ssh no soporta --env en esta versión: el token va por
          # stdin (read) y se interpola solo dentro del codespace.
          printf '%s' "${{ secrets.CODESPACES_TOKEN }}" | \
          gh codespace ssh -c "${{ steps.cs.outputs.name }}" -- \
            'read -r PULL_TOKEN; cd /workspaces/d1mano-automation && \
             git fetch -q https://x-access-token:$PULL_TOKEN@github.com/d1Mano/d1mano-automation.git main && \
             git reset --hard FETCH_HEAD >/dev/null && \
             echo "repo actualizado: $(git log -1 --format=%h)"'

      - name: Inyectar credenciales runtime (start|selftest)
        if: inputs.action == 'start' || inputs.action == 'selftest'
        run: |
          # Los user secrets de Codespaces no llegan al SSH no interactivo:
          # se escriben en .env.runtime (gitignored, 600) que agent_ctl carga.
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_KEY=%s\nWORKSPACE_ID=%s\nGH_BILLING_TOKEN_A=%s\nGH_BILLING_TOKEN_B=%s\n' \
            "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "${{ inputs.workspace_id }}" "${{ secrets.BILLING_TOKEN_A }}" "${{ secrets.BILLING_TOKEN_B }}" | \
          gh codespace ssh -c "${{ steps.cs.outputs.name }}" -- \
            'cat > /workspaces/d1mano-automation/.env.runtime && \
             chmod 600 /workspaces/d1mano-automation/.env.runtime && echo credenciales inyectadas'

      - name: Limpiar credenciales runtime (stop)
        if: inputs.action == 'stop'
        run: |
          gh codespace ssh -c "${{ steps.cs.outputs.name }}" -- \
            'rm -f /workspaces/d1mano-automation/.env.runtime && echo credenciales limpiadas' || true

      - name: Ejecutar acción sobre el runtime
        run: |
          ACTION="${{ inputs.action }}"
          case "$ACTION" in
            start|selftest)
              # selftest = validación completa sin bot; start = bridge real (requiere token en system_config)
              if [ "$ACTION" = "selftest" ]; then EXTRA="--selftest"; else EXTRA=""; fi
              gh codespace ssh -c "${{ steps.cs.outputs.name }}" -- \
                "cd /workspaces/d1mano-automation && python3 agent/agent_ctl.py start $EXTRA"
              ;;
            status)
              gh codespace ssh -c "${{ steps.cs.outputs.name }}" -- \
                'cd /workspaces/d1mano-automation && python3 agent/agent_ctl.py status'
              ;;
            stop)
              gh codespace ssh -c "${{ steps.cs.outputs.name }}" -- \
                'cd /workspaces/d1mano-automation && python3 agent/agent_ctl.py stop'
              ;;
            *)
              echo "::error::acción desconocida: $ACTION"; exit 1 ;;
          esac
