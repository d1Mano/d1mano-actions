name: generate-post

# ─────────────────────────────────────────────────────────────
# Genera LA PUBLICACIÓN de un poster (una sola por petición).
#
# Canal: edge trigger-github-action (d1Mano) →
#   { task: 'generate-post', post_id: '<uuid>' }
#
# Flujo:
#   1. Lee el brief congelado del post (boceto_posts.brief) + la fila
#      con service role (Supabase REST, pasa RLS).
#   2. Llama al LLM (Groq u OpenRouter vía OPENROUTER_API_KEY) con el
#      template del generador (scripts/generate_post_prompt.md del repo
#      d1mano-automation) y el brief como contexto.
#   3. Escribe caption/blocks/status DIRECTAMENTE en boceto_posts
#      (service role pasa RLS — mismo patrón que agent_tasks).
#
# Secretos requeridos (GitHub Secrets de este repo):
#   SUPABASE_URL          → project URL (axmbjpfzydlvbabgtmoi)
#   SUPABASE_SERVICE_ROLE → service role key (NUNCA anon)
#   OPENROUTER_API_KEY    → key del LLM (o GROQ_API_KEY)
#   POST_MODEL            → (opcional) modelo, default openai/gpt-4o-mini
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'id de la fila boceto_posts (uuid)'
        required: true
        type: string

permissions: {}

concurrency:
  group: generate-post-${{ inputs.post_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout orquestador
        uses: actions/checkout@v4

      - name: Generar publicación y escribir resultado
        env:
          POST_ID: ${{ inputs.post_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POST_MODEL: ${{ vars.POST_MODEL }}
          # PAT de lectura para bajar el template del generador desde el
          # repo PRIVADO d1mano-automation (scripts/generate_post_prompt.md).
          AUTOMATION_PAT: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          bash scripts/generate-post.sh "$POST_ID"
