name: manage-workspace

# Fase 3 — gestión del Codespace del workspace + estado en Supabase:
#   localizar / arrancar / parar / estado, vía GitHub REST API.
# El Codespace se crea sobre WORKSPACE_REPO (donde vive el devcontainer).
# Cada transición se registra en agent_control.workspaces (RPC service) para
# que la app conozca el estado sin entrar a Actions.
#
# Secrets requeridos (Settings → Secrets de este repo):
#   CODESPACES_TOKEN     PAT de la cuenta colaboradora (scopes codespace + repo)
#   SUPABASE_URL         URL del proyecto d1Mano
#   SUPABASE_SERVICE_KEY service key (RPC public.workspace_set_status)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción: start | stop | status | list"
        required: true
        default: "status"
        type: string
      workspace_id:
        description: "Fila en Supabase (workspace-a | workspace-b)"
        required: false
        default: "workspace-a"
        type: string
      workspace:
        description: "Nombre del Codespace (opcional; si no, el primero del repo)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  API: https://api.github.com
  WORKSPACE_REPO: d1Mano/d1mano-automation
  # token de la cuenta dueña del codespace: A=Lugoci-dev, B=d1Mano
  GH_TOKEN_A: ${{ secrets.CODESPACES_TOKEN }}
  GH_TOKEN_B: ${{ secrets.CODESPACES_TOKEN_B }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Token de la cuenta dueña (A o B)
        run: |
          if [ "${{ inputs.workspace_id }}" = "workspace-b" ]; then
            echo "GH_TOKEN=$GH_TOKEN_B" >> "$GITHUB_ENV"
          else
            echo "GH_TOKEN=$GH_TOKEN_A" >> "$GITHUB_ENV"
          fi

      - name: Preparar helper RPC (persiste como archivo entre steps)
        run: |
          cat > rpc.sh <<'EOF'
          #!/usr/bin/env bash
          # usage: rpc.sh <status> <event> [extra-json]
          STATUS="$1"; EVENT="$2"; EXTRA="${3:-}"
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/workspace_set_status" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_workspace\":\"${{ inputs.workspace_id }}\",\"p_status\":\"$STATUS\",\"p_event\":\"$EVENT\"${EXTRA:+,$EXTRA}}" \
            || echo "::warning::sin estado en Supabase (revisa secrets SUPABASE_*)"
          EOF

      - name: Listar Codespaces del workspace
        if: inputs.action == 'list'
        run: |
          gh api "$API/repos/$WORKSPACE_REPO/codespaces" \
            --jq '.codespaces[] | {name, state, machine: .machine.display_name, idle_timeout: .idle_timeout_minutes}'

      - name: Estado del workspace
        if: inputs.action == 'status'
        run: |
          if [ -n "${{ inputs.workspace }}" ]; then
            gh api "$API/user/codespaces/${{ inputs.workspace }}" \
              --jq '{name, state, machine: .machine.display_name, last_used: .last_used_at}'
          else
            gh api "$API/repos/$WORKSPACE_REPO/codespaces" \
              --jq '.codespaces[] | {name, state, machine: .machine.display_name}'
          fi

      - name: Arrancar workspace
        if: inputs.action == 'start'
        run: |
          bash rpc.sh starting start_requested
          NAME="${{ inputs.workspace }}"
          if [ -z "$NAME" ]; then
            NAME=$(gh api "$API/repos/$WORKSPACE_REPO/codespaces" \
              --jq '.codespaces[0].name // empty')
          fi
          if [ -z "$NAME" ]; then
            echo "No hay Codespace: creando uno sobre $WORKSPACE_REPO…"
            CREATED=$(gh api -X POST "$API/repos/$WORKSPACE_REPO/codespaces" \
              -f machine=basicLinux32gb -f branch=main)
            NAME=$(echo "$CREATED" | jq -r .name)
          else
            STATE=$(gh api "$API/user/codespaces/$NAME" --jq .state)
            echo "Estado inicial de $NAME: $STATE"
            # Available/Running = ya activo (sin sesión abierta reporta Available)
            case "$STATE" in
              Running|Available) : ;;
              *) gh api -X POST "$API/user/codespaces/$NAME/start" >/dev/null || true ;;
            esac
          fi
          # Esperar a activo (máx ~5 min)
          STATE=""
          for i in $(seq 1 15); do
            sleep 20
            STATE=$(gh api "$API/user/codespaces/$NAME" --jq .state)
            echo "  [$i] $NAME = $STATE"
            case "$STATE" in Running|Available|Failed) break;; esac
          done
          case "$STATE" in
            Running|Available)
              bash rpc.sh running started "\"p_codespace_name\":\"$NAME\"" ;;
            *)
              bash rpc.sh stopped start_failed "\"p_codespace_name\":\"$NAME\",\"p_final_state\":\"$STATE\""
              exit 1 ;;
          esac

      - name: Desplegar runtime dentro del codespace (start)
        if: inputs.action == 'start'
        run: |
          NAME="${{ inputs.workspace }}"
          if [ -z "$NAME" ]; then
            NAME=$(gh api "$API/repos/$WORKSPACE_REPO/codespaces" --jq '.codespaces[0].name // empty')
          fi
          if [ -z "$NAME" ]; then
            echo "::error::sin codespace para desplegar runtime"; exit 1
          fi
          # 1) repo al día dentro del codespace (fetch con token A: solo lectura)
          printf '%s' "${{ secrets.CODESPACES_TOKEN }}" | \
          gh codespace ssh -c "$NAME" -- \
            'read -r PULL_TOKEN; cd /workspaces/d1mano-automation && \
             git fetch -q https://x-access-token:$PULL_TOKEN@github.com/d1Mano/d1mano-automation.git main && \
             git reset --hard FETCH_HEAD >/dev/null && echo "repo: $(git log -1 --format=%h)"'
          # 2) credenciales runtime (.env.runtime, gitignored, 600)
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_KEY=%s\nWORKSPACE_ID=%s\nGH_BILLING_TOKEN_A=%s\nGH_BILLING_TOKEN_B=%s\n' \
            "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "${{ inputs.workspace_id }}" "${{ secrets.BILLING_TOKEN_A }}" "${{ secrets.BILLING_TOKEN_B }}" | \
          gh codespace ssh -c "$NAME" -- \
            'cat > /workspaces/d1mano-automation/.env.runtime && \
             chmod 600 /workspaces/d1mano-automation/.env.runtime && echo env OK'
          # 3) bridge + opencode (tolera estar ya corriendo)
          gh codespace ssh -c "$NAME" -- \
            'cd /workspaces/d1mano-automation && python3 agent/agent_ctl.py start'

      - name: Parar workspace
        if: inputs.action == 'stop'
        run: |
          bash rpc.sh stopping stop_requested
          NAME="${{ inputs.workspace }}"
          if [ -z "$NAME" ]; then
            NAME=$(gh api "$API/repos/$WORKSPACE_REPO/codespaces" \
              --jq '.codespaces[0].name // empty')
          fi
          if [ -n "$NAME" ]; then
            echo "Parando $NAME…"
            gh api -X POST "$API/user/codespaces/$NAME/stop" >/dev/null
            bash rpc.sh stopped stopped "\"p_codespace_name\":\"$NAME\""
          else
            echo "No hay Codespace que parar."
            bash rpc.sh stopped stopped_noop
          fi
